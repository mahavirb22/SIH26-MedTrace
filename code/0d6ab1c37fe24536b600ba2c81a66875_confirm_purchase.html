  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-4 flex items-center gap-3"><button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-primary/5 rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Medicine Details</h1></div></header><main class="flex-1 relative w-full pt-16 bg-surface"><div class="flex flex-col w-full h-full justify-between pb-safe px-4" id="otp-container">
<div class="flex flex-col gap-margin-desktop pt-8 mt-12 mb-8">
<div class="flex flex-col gap-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Confirm you bought this medicine</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">We sent a 6-digit code to your registered device to verify this transaction.</p>
</div>
<div class="flex flex-col gap-6">
<div class="flex justify-between gap-2 max-w-[340px] w-full mx-auto" id="otp-inputs">
<input autocomplete="off" class="w-12 h-14 rounded-lg bg-surface-container-low border border-outline-variant/30 text-center font-code-md text-headline-lg-mobile text-primary focus:border-primary focus:bg-surface focus:outline-none transition-all shadow-[0_2px_8px_rgba(22,60,49,0.02)]" maxlength="1" type="tel"/>
<input autocomplete="off" class="w-12 h-14 rounded-lg bg-surface-container-low border border-outline-variant/30 text-center font-code-md text-headline-lg-mobile text-primary focus:border-primary focus:bg-surface focus:outline-none transition-all shadow-[0_2px_8px_rgba(22,60,49,0.02)]" maxlength="1" type="tel"/>
<input autocomplete="off" class="w-12 h-14 rounded-lg bg-surface-container-low border border-outline-variant/30 text-center font-code-md text-headline-lg-mobile text-primary focus:border-primary focus:bg-surface focus:outline-none transition-all shadow-[0_2px_8px_rgba(22,60,49,0.02)]" maxlength="1" type="tel"/>
<input autocomplete="off" class="w-12 h-14 rounded-lg bg-surface-container-low border border-outline-variant/30 text-center font-code-md text-headline-lg-mobile text-primary focus:border-primary focus:bg-surface focus:outline-none transition-all shadow-[0_2px_8px_rgba(22,60,49,0.02)]" maxlength="1" type="tel"/>
<input autocomplete="off" class="w-12 h-14 rounded-lg bg-surface-container-low border border-outline-variant/30 text-center font-code-md text-headline-lg-mobile text-primary focus:border-primary focus:bg-surface focus:outline-none transition-all shadow-[0_2px_8px_rgba(22,60,49,0.02)]" maxlength="1" type="tel"/>
<input autocomplete="off" class="w-12 h-14 rounded-lg bg-surface-container-low border border-outline-variant/30 text-center font-code-md text-headline-lg-mobile text-primary focus:border-primary focus:bg-surface focus:outline-none transition-all shadow-[0_2px_8px_rgba(22,60,49,0.02)]" maxlength="1" type="tel"/>
</div>
<div class="flex items-center justify-center gap-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">Didn't receive it?</p>
<button class="font-body-sm text-body-sm font-semibold text-primary hover:text-primary/80 transition-colors">Resend Code</button>
</div>
</div>
<div class="flex justify-center py-4 opacity-20 hidden" id="blister-divider">
<div class="flex gap-1">
<div class="w-2 h-2 rounded-full bg-outline"></div>
<div class="w-2 h-2 rounded-full bg-outline"></div>
<div class="w-2 h-2 rounded-full bg-outline"></div>
<div class="w-2 h-2 rounded-full bg-outline"></div>
<div class="w-2 h-2 rounded-full bg-outline"></div>
</div>
</div>
</div>
<div class="flex flex-col gap-4 mt-auto pt-8">
<div class="hidden flex flex-col items-center justify-center gap-4 py-8 opacity-0 transition-opacity duration-500" id="success-state">
<div class="w-16 h-16 rounded-full bg-secondary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Purchase Confirmed</p>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[260px]">The authenticity of this product has been verified and recorded.</p>
</div>
<button class="w-full h-14 rounded-full bg-primary text-on-primary font-body-md text-body-md font-semibold flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-[0.98] transition-all shadow-[0_4px_20px_rgba(22,60,49,0.15)]" id="confirm-btn">
            Confirm Purchase
        </button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const inputs = document.querySelectorAll('#otp-inputs input');
        const confirmBtn = document.getElementById('confirm-btn');
        const successState = document.getElementById('success-state');
        const otpContainer = document.getElementById('otp-container');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0,1);
                }
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
                checkInputs();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value) {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
            
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 6);
                if (/^\d+$/.test(pastedData)) {
                    pastedData.split('').forEach((char, i) => {
                        if (inputs[i]) {
                            inputs[i].value = char;
                            if (i < inputs.length - 1) inputs[i+1].focus();
                        }
                    });
                    checkInputs();
                }
            });
        });

        function checkInputs() {
            const allFilled = Array.from(inputs).every(input => input.value.length === 1);
            if(allFilled) {
                confirmBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
                confirmBtn.classList.remove('bg-primary', 'text-on-primary');
            } else {
                confirmBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                confirmBtn.classList.add('bg-primary', 'text-on-primary');
            }
        }

        confirmBtn.addEventListener('click', () => {
            const allFilled = Array.from(inputs).every(input => input.value.length === 1);
            if (!allFilled) {
                inputs.forEach(input => {
                    if(!input.value) {
                        input.classList.add('border-error');
                        setTimeout(() => input.classList.remove('border-error'), 500);
                    }
                });
                return;
            }

            confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Verifying...';
            
            setTimeout(() => {
                // Hide input section
                document.querySelector('.gap-margin-desktop').classList.add('hidden');
                confirmBtn.classList.add('hidden');
                
                // Show success
                successState.classList.remove('hidden');
                // Trigger reflow
                void successState.offsetWidth;
                successState.classList.remove('opacity-0');
            }, 1200);
        });
        
        // Focus first input initially
        setTimeout(() => {
            if(inputs[0]) inputs[0].focus();
        }, 500);
    });
</script></main></body></html>
