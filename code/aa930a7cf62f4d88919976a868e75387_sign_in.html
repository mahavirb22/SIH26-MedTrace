  </head><body class="bg-surface font-body-md text-on-surface"><main class="relative w-full"><div class="flex flex-col w-full p-margin-mobile gap-8 pb-safe">
<!-- Step 1: Phone Verification -->
<div class="flex flex-col w-full transition-opacity duration-300" id="step-phone">
<div class="flex flex-col gap-4 mt-8">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Verified Integrity</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
        Secure access to pharmaceutical records. Please verify your clinical identity.
      </p>
</div>
<!-- Blister Pack Motif Divider -->
<div class="flex gap-1 my-8">
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-6 flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="phone-input">Mobile Number</label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-surface font-code-md text-code-md p-4 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary transition-shadow placeholder-outline-variant" id="phone-input" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-body-md text-body-md py-4 rounded-full flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-md" id="continue-btn">
        Continue
        <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
<!-- Step 2: OTP Verification (Initially Hidden) -->
<div class="hidden flex-col w-full transition-opacity duration-300 opacity-0" id="step-otp">
<div class="flex flex-col gap-4 mt-8">
<button class="self-start text-on-surface-variant p-2 -ml-2 rounded-full bg-surface-container-low" id="back-btn">
<span class="material-symbols-outlined text-xl">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Authentication</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
        Enter the 6-digit clinical access code sent to <span class="font-code-md text-code-md text-on-surface" id="display-phone"></span>
</p>
</div>
<!-- Blister Pack Motif Divider -->
<div class="flex gap-1 my-8">
<div class="w-2 h-2 rounded-full bg-primary opacity-100"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant opacity-30"></div>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-6 flex flex-col gap-8">
<div class="flex flex-col gap-3">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase text-center">Secure Code</label>
<div class="flex justify-between gap-2" id="otp-container">
<input class="otp-input w-12 h-14 bg-surface-container-low text-on-surface font-code-md text-headline-lg-mobile text-center rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-highest transition-colors placeholder-outline-variant" maxlength="1" placeholder="-" type="number"/>
<input class="otp-input w-12 h-14 bg-surface-container-low text-on-surface font-code-md text-headline-lg-mobile text-center rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-highest transition-colors placeholder-outline-variant" maxlength="1" placeholder="-" type="number"/>
<input class="otp-input w-12 h-14 bg-surface-container-low text-on-surface font-code-md text-headline-lg-mobile text-center rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-highest transition-colors placeholder-outline-variant" maxlength="1" placeholder="-" type="number"/>
<input class="otp-input w-12 h-14 bg-surface-container-low text-on-surface font-code-md text-headline-lg-mobile text-center rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-highest transition-colors placeholder-outline-variant" maxlength="1" placeholder="-" type="number"/>
<input class="otp-input w-12 h-14 bg-surface-container-low text-on-surface font-code-md text-headline-lg-mobile text-center rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-highest transition-colors placeholder-outline-variant" maxlength="1" placeholder="-" type="number"/>
<input class="otp-input w-12 h-14 bg-surface-container-low text-on-surface font-code-md text-headline-lg-mobile text-center rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-highest transition-colors placeholder-outline-variant" maxlength="1" placeholder="-" type="number"/>
</div>
</div>
<button class="w-full bg-secondary-container text-on-secondary-container font-body-md text-body-md py-4 rounded-full flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-md" id="verify-btn">
<span class="material-symbols-outlined text-lg">verified_user</span>
        Verify Identity
      </button>
<button class="w-full text-center font-body-sm text-body-sm text-on-surface-variant underline py-2">
        Resend Code
      </button>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const stepPhone = document.getElementById('step-phone');
    const stepOtp = document.getElementById('step-otp');
    const continueBtn = document.getElementById('continue-btn');
    const backBtn = document.getElementById('back-btn');
    const phoneInput = document.getElementById('phone-input');
    const displayPhone = document.getElementById('display-phone');
    const otpInputs = document.querySelectorAll('.otp-input');

    // Basic format for phone visually (not strictly enforced for simplicity)
    phoneInput.addEventListener('input', (e) => {
      let val = e.target.value.replace(/\D/g, '');
      if (val.length > 10) val = val.slice(0, 10);
      e.target.value = val;
    });

    // Switch to OTP
    continueBtn.addEventListener('click', () => {
      if(phoneInput.value.length < 1) return;
      displayPhone.textContent = phoneInput.value;
      
      // Fade out phone
      stepPhone.classList.remove('opacity-100');
      stepPhone.classList.add('opacity-0');
      
      setTimeout(() => {
        stepPhone.classList.add('hidden');
        stepPhone.classList.remove('flex');
        
        stepOtp.classList.remove('hidden');
        stepOtp.classList.add('flex');
        
        // Trigger reflow
        void stepOtp.offsetWidth;
        
        stepOtp.classList.remove('opacity-0');
        stepOtp.classList.add('opacity-100');
        
        otpInputs[0].focus();
      }, 300);
    });

    // Switch back to Phone
    backBtn.addEventListener('click', () => {
      stepOtp.classList.remove('opacity-100');
      stepOtp.classList.add('opacity-0');
      
      setTimeout(() => {
        stepOtp.classList.add('hidden');
        stepOtp.classList.remove('flex');
        
        stepPhone.classList.remove('hidden');
        stepPhone.classList.add('flex');
        
        // Trigger reflow
        void stepPhone.offsetWidth;
        
        stepPhone.classList.remove('opacity-0');
        stepPhone.classList.add('opacity-100');
      }, 300);
    });

    // OTP Input Logic
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length > 1) {
          e.target.value = e.target.value.slice(0, 1);
        }
        if (e.target.value !== '' && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
          otpInputs[index - 1].focus();
          otpInputs[index - 1].value = '';
        }
      });
    });
    
    // Verify Animation
    const verifyBtn = document.getElementById('verify-btn');
    verifyBtn.addEventListener('click', () => {
      const icon = verifyBtn.querySelector('.material-symbols-outlined');
      icon.textContent = 'hourglass_empty';
      icon.classList.add('animate-spin');
      setTimeout(() => {
        icon.classList.remove('animate-spin');
        icon.textContent = 'check_circle';
        verifyBtn.classList.replace('bg-secondary-container', 'bg-primary');
        verifyBtn.classList.replace('text-on-secondary-container', 'text-on-primary');
        verifyBtn.innerHTML = `<span class="material-symbols-outlined text-lg">check_circle</span> Verified`;
      }, 1500);
    });
  });
</script></main></body></html>
